<body>

  <header>
    <div class="container-header">
      <img src="img/positiva.png" alt="Pizza Show Logo" class="logo" />
      <nav>
        <ul>
          <li><a href="index.html">Início</a></li>

          <li><a href="cadastro.html" class="active">Cadastro</a></li>
          <li><a href="carrinho.html">Carrinho (0)</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="form-container">
      <form class="formulario">
        <h1>Cadastro</h1>
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="exemplo@email.com" required />

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required />

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" placeholder="Crie sua senha" required />

        <button type="submit">Cadastrar</button>
      </form>
    </div>
  </main>

  <footer>
    © 2025 Pizza Show - Todos os direitos reservados.
  </footer>

</body>
</html>
