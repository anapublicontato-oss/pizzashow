  <main>
  <h1>Seu Carrinho</h1>
  <ul id="lista-carrinho" class="produtos-lista"></ul>
  <p class="total" id="total-carrinho"></p>
  <button id="confirmar-pedido" onclick="confirmarPedido()">Confirmar Pedido</button>
</main>

<script>
  function atualizarContadorCarrinho() {
    const carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
    const count = carrinho.reduce((acc, item) => acc + item.quantidade, 0);
    document.getElementById('carrinho-count').textContent = count;
  }

  function removerItem(nome) {
    let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
    carrinho = carrinho.filter(item => item.nome !== nome);
    localStorage.setItem('carrinho', JSON.stringify(carrinho));
    carregarCarrinho();
    atualizarContadorCarrinho();
  }

  function carregarCarrinho() {
    const lista = document.getElementById('lista-carrinho');
    const totalElem = document.getElementById('total-carrinho');
    let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
    lista.innerHTML = '';

    const btnConfirmar = document.getElementById('confirmar-pedido');

    if (carrinho.length === 0) {
      lista.innerHTML = '<li>Seu carrinho está vazio.</li>';
      totalElem.textContent = '';
      btnConfirmar.disabled = true; // desabilita o botão
      btnConfirmar.style.opacity = 0.6;
      return;
    }

    let total = 0;

    carrinho.forEach(item => {
      total += item.preco * item.quantidade;
      const li = document.createElement('li');
      li.innerHTML = `
        ${item.nome} - R$ ${item.preco.toFixed(2)} x ${item.quantidade}
        <button class="remover-btn" onclick="removerItem('${item.nome}')">Remover</button>
      `;
      lista.appendChild(li);
    });

    totalElem.textContent = 'Total: R$ ' + total.toFixed(2);

    btnConfirmar.disabled = false; // habilita o botão
    btnConfirmar.style.opacity = 1;
  }

  function confirmarPedido() {
    const carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
    if (carrinho.length === 0) {
      alert("Seu carrinho está vazio!");
      return;
    }
    window.location.href = "delivery.html";
  }

  atualizarContadorCarrinho();
  carregarCarrinho();
</script>
